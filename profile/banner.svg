<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1110"/>
      <stop offset="1" stop-color="#121b16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c6922f"/>
      <stop offset="1" stop-color="#e3bd76"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c6922f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c6922f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <circle cx="176" cy="170" r="150" fill="url(#halo)"/>

  <!-- faint grid -->
  <g stroke="#1b2922" stroke-width="1" opacity="0.6">
    <path d="M0 68 H1280 M0 136 H1280 M0 204 H1280 M0 272 H1280"/>
    <path d="M160 0 V340 M320 0 V340 M480 0 V340 M640 0 V340 M800 0 V340 M960 0 V340 M1120 0 V340"/>
  </g>
  <!-- corner ticks -->
  <g stroke="url(#brass)" stroke-width="3" opacity="0.85" fill="none">
    <path d="M28 28 h34 M28 28 v34"/>
    <path d="M1252 312 h-34 M1252 312 v-34"/>
  </g>

  <!-- emblem: hexagon + C -->
  <g transform="translate(176,170)">
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="#0d1613" stroke="url(#brass)" stroke-width="4"/>
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="#c6922f" stroke-width="1" opacity="0.4" transform="scale(0.86)"/>
    <text x="0" y="30" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="86" font-weight="600" fill="#e8e3d6">C</text>
  </g>

  <!-- wordmark -->
  <text x="320" y="152" fill="#e8e3d6" font-family="Georgia,'Times New Roman',serif" font-size="72" font-weight="600" letter-spacing="0.5">Cryptid<tspan fill="url(#brass)"> Security</tspan></text>
  <rect x="322" y="178" width="610" height="2.5" fill="url(#brass)" opacity="0.8"/>
  <text x="324" y="222" fill="#98a197" font-size="26">Malware Analysis   ·   Reverse Engineering   ·   DFIR   ·   AppSec</text>
  <text x="324" y="262" fill="#6f7a72" font-size="17">Fifteen open-source tools   ·   zero-dependency by design   ·   fully tested   ·   trust nothing, verify everything</text>
</svg>
