<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00c2ff"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.6" stop-color="#e01e1e"/>
      <stop offset="1" stop-color="#7a0000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#172033" stroke-width="1" opacity="0.6">
    <path d="M0 68 H1280 M0 136 H1280 M0 204 H1280 M0 272 H1280"/>
    <path d="M160 0 V340 M320 0 V340 M480 0 V340 M640 0 V340 M800 0 V340 M960 0 V340 M1120 0 V340"/>
  </g>
  <!-- corner ticks -->
  <g stroke="url(#accent)" stroke-width="3" opacity="0.8" fill="none">
    <path d="M28 28 h34 M28 28 v34"/>
    <path d="M1252 312 h-34 M1252 312 v-34"/>
  </g>

  <!-- emblem: hexagon + K + watching eye -->
  <g transform="translate(176,170)" filter="url(#glow)">
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="#0d1320" stroke="url(#accent)" stroke-width="4"/>
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="#00ff9c" stroke-width="1" opacity="0.4" transform="scale(0.86)"/>
    <text x="0" y="30" text-anchor="middle" font-size="86" font-weight="800" fill="#f0f6fc">C</text>
  </g>

  <!-- wordmark -->
  <text x="320" y="150" fill="#f0f6fc" font-size="70" font-weight="800" letter-spacing="1">CRYPTID<tspan fill="#00ff9c"> SECURITY</tspan></text>
  <rect x="322" y="174" width="636" height="3" fill="url(#accent)"/>
  <text x="324" y="222" fill="#9aa4b2" font-size="27" font-weight="500">Malware Analysis · Reverse Engineering · DFIR · AppSec</text>
  <text x="324" y="262" fill="#6e7681" font-size="18">15 open-source tools  ·  zero-dependency by design  ·  fully tested  ·  trust nothing, verify everything</text>
</svg>
